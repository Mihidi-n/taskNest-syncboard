<svg viewBox="0 0 900 560" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="900" height="560" fill="#ffffff"/>

  <!-- Header bar -->
  <rect x="0" y="0" width="900" height="56" fill="#f3f3f3" stroke="#bbb"/>
  <rect x="20" y="16" width="24" height="24" fill="#bbb"/>
  <text x="56" y="33" font-size="16" fill="#333">CollabBoard</text>
  <rect x="740" y="18" width="140" height="20" fill="none" stroke="#bbb" stroke-dasharray="3,2"/>
  <text x="750" y="32" font-size="10" fill="#888">status badge</text>

  <!-- Column 1 -->
  <g>
    <rect x="24" y="80" width="270" height="460" fill="#fafafa" stroke="#ccc"/>
    <text x="40" y="106" font-size="13" fill="#555">TO DO</text>
    <circle cx="270" cy="100" r="10" fill="none" stroke="#ccc"/>
    <text x="266" y="104" font-size="9" fill="#888">n</text>

    <rect x="38" y="122" width="242" height="66" fill="#fff" stroke="#ccc"/>
    <line x1="38" y1="122" x2="38" y2="188" stroke="#999" stroke-width="3"/>
    <text x="48" y="138" font-size="9" fill="#999">TB-001</text>
    <line x1="48" y1="150" x2="230" y2="150" stroke="#ddd" stroke-width="6"/>
    <line x1="48" y1="164" x2="200" y2="164" stroke="#eee" stroke-width="4"/>
    <circle cx="255" cy="175" r="9" fill="none" stroke="#ccc"/>

    <rect x="38" y="198" width="242" height="66" fill="#fff" stroke="#ccc"/>
    <line x1="38" y1="198" x2="38" y2="264" stroke="#999" stroke-width="3"/>
    <text x="48" y="214" font-size="9" fill="#999">TB-002</text>
    <line x1="48" y1="226" x2="230" y2="226" stroke="#ddd" stroke-width="6"/>
    <line x1="48" y1="240" x2="200" y2="240" stroke="#eee" stroke-width="4"/>
    <circle cx="255" cy="251" r="9" fill="none" stroke="#ccc"/>

    <rect x="38" y="280" width="242" height="28" fill="none" stroke="#ccc" stroke-dasharray="3,2"/>
    <text x="48" y="298" font-size="10" fill="#999">+ add a card</text>
  </g>

  <!-- Column 2 (mid-drag) -->
  <g>
    <rect x="312" y="80" width="270" height="460" fill="#eef0ff" stroke="#99a3e6"/>
    <text x="328" y="106" font-size="13" fill="#555">DOING</text>
    <circle cx="558" cy="100" r="10" fill="none" stroke="#ccc"/>

    <rect x="326" y="122" width="242" height="66" fill="#fff" stroke="#7885d6" stroke-width="2"/>
    <text x="336" y="138" font-size="9" fill="#999">TB-004</text>
    <line x1="336" y1="150" x2="518" y2="150" stroke="#ddd" stroke-width="6"/>
    <line x1="336" y1="164" x2="480" y2="164" stroke="#eee" stroke-width="4"/>

    <!-- dragged card, offset + shadow to suggest motion -->
    <rect x="360" y="220" width="242" height="66" fill="#fff" stroke="#7885d6" stroke-width="2" opacity="0.7"/>
    <text x="370" y="236" font-size="9" fill="#999">TB-005 (dragging)</text>
    <line x1="370" y1="248" x2="552" y2="248" stroke="#ddd" stroke-width="6"/>
    <path d="M 250 190 L 380 220" stroke="#7885d6" stroke-width="1.5" fill="none" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

    <rect x="326" y="300" width="242" height="28" fill="none" stroke="#ccc" stroke-dasharray="3,2"/>
    <text x="336" y="318" font-size="10" fill="#999">+ add a card</text>
  </g>

  <!-- Column 3 -->
  <g>
    <rect x="600" y="80" width="270" height="460" fill="#fafafa" stroke="#ccc"/>
    <text x="616" y="106" font-size="13" fill="#555">DONE</text>
    <circle cx="846" cy="100" r="10" fill="none" stroke="#ccc"/>

    <rect x="614" y="122" width="242" height="66" fill="#fff" stroke="#ccc"/>
    <text x="624" y="138" font-size="9" fill="#999">TB-006</text>
    <line x1="624" y1="150" x2="806" y2="150" stroke="#ddd" stroke-width="6"/>
    <line x1="624" y1="164" x2="770" y2="164" stroke="#eee" stroke-width="4"/>

    <rect x="614" y="198" width="242" height="28" fill="none" stroke="#ccc" stroke-dasharray="3,2"/>
    <text x="624" y="216" font-size="10" fill="#999">+ add a card</text>
  </g>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#7885d6"/>
    </marker>
  </defs>

  <text x="24" y="552" font-size="10" fill="#aaa">Low-fidelity wireframe — 3 columns, draggable cards, inline "add card" affordance per column.</text>
</svg>
